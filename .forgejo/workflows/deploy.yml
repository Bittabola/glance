on:
  push:
    branches: [main]

env:
  REGISTRY: git.fayzullaev.ca
  IMAGE: git.fayzullaev.ca/${{ github.repository }}:latest

jobs:
  deploy:
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install dependencies
        run: apk add --no-cache git openssh-client

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://oauth2:${TOKEN}@${REGISTRY}/${GITHUB_REPOSITORY}.git" .

      - name: Build and push
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u ${{ github.actor }} --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Dockge
        env:
          DOCKER_HOST_SSH_KEY: ${{ secrets.DOCKER_HOST_SSH_KEY }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p ~/.ssh
          echo "$DOCKER_HOST_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key bittabola@10.32.64.5 \
            "bash -c 'docker pull ${IMAGE} && cd /opt/stacks/${REPO_NAME} && docker compose up -d'"
